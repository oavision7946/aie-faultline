# Local service stack: ClickHouse.
# Do not run directly; use `make up` (or `faultline stack up`), which supplies every
# variable below from config/*.yaml and the secrets from .env.
name: faultline

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?set by faultline stack}
    container_name: faultline-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?}
      CLICKHOUSE_READONLY_PASSWORD: ${CLICKHOUSE_READONLY_PASSWORD:?}
      CLICKHOUSE_RO_MAX_EXECUTION_TIME: ${CLICKHOUSE_RO_MAX_EXECUTION_TIME:?}
      CLICKHOUSE_RO_MAX_RESULT_ROWS: ${CLICKHOUSE_RO_MAX_RESULT_ROWS:?}
      CLICKHOUSE_RO_MAX_ROWS_TO_READ: ${CLICKHOUSE_RO_MAX_ROWS_TO_READ:?}
      CLICKHOUSE_RO_MAX_MEMORY_USAGE: ${CLICKHOUSE_RO_MAX_MEMORY_USAGE:?}
    ports:
      - "${FAULTLINE_BIND_HOST:?}:${CLICKHOUSE_HTTP_PORT:?}:8123"
      - "${FAULTLINE_BIND_HOST:?}:${CLICKHOUSE_NATIVE_PORT:?}:9000"
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:?}
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ../clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ../clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  clickhouse-data:
