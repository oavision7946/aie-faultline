[project]
name = "aie-faultline-knowledge"
version = "0.0.0"
description = "Embedding and retrieval over a knowledge store."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aie-faultline-core"]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "faultline_knowledge"

[tool.uv.sources]
aie-faultline-core = { workspace = true }
