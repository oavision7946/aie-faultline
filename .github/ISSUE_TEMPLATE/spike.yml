name: Spike
description: A time-boxed investigation that answers one question.
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes: {label: Question}
    validations: {required: true}
  - type: input
    id: timebox
    attributes: {label: Timebox, placeholder: "1 day"}
    validations: {required: true}
  - type: textarea
    id: output
    attributes: {label: Expected output, description: "Decision, measurement or recommendation"}
