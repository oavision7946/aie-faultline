name: Experiment
description: A measured comparison with an explicit pass or fail gate.
labels: ["type:experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes: {label: Hypothesis}
    validations: {required: true}
  - type: input
    id: dataset
    attributes: {label: Dataset and split}
    validations: {required: true}
  - type: textarea
    id: metrics
    attributes: {label: Metrics}
    validations: {required: true}
  - type: textarea
    id: gate
    attributes: {label: Exit gate, description: What result decides the outcome?}
    validations: {required: true}
