name: Feature
description: A new capability or an improvement.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What need does this address?}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal}
  - type: textarea
    id: done
    attributes: {label: Acceptance criteria, description: How will we know it is done?}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [core, llm, datasets, replay, ingest, detect, correlate, knowledge, tools, agent, evals, api, cli, config, infra, docs]
