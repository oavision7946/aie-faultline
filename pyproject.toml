[project]
name = "aie-faultline"
version = "0.0.0"
description = "AI-powered failure analysis for distributed systems."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "aie-faultline-core",
    "aie-faultline-llm",
    "aie-faultline-datasets",
    "aie-faultline-replay",
    "aie-faultline-ingest",
    "aie-faultline-detect",
    "aie-faultline-correlate",
    "aie-faultline-knowledge",
    "aie-faultline-tools",
    "aie-faultline-agent",
    "aie-faultline-evals",
    "aie-faultline-cli",
    "aie-faultline-api",
    "pytest-cov>=7.1.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
    "types-pyyaml>=6.0.12.20261103",
    "psycopg[binary]>=3.3.8",
    "pre-commit>=4.7.0",
]

[tool.uv]
package = false
# The single lockfile must install on every supported developer and server platform.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/ui"]

[tool.uv.sources]
aie-faultline-core = { workspace = true }
aie-faultline-llm = { workspace = true }
aie-faultline-datasets = { workspace = true }
aie-faultline-replay = { workspace = true }
aie-faultline-ingest = { workspace = true }
aie-faultline-detect = { workspace = true }
aie-faultline-correlate = { workspace = true }
aie-faultline-knowledge = { workspace = true }
aie-faultline-tools = { workspace = true }
aie-faultline-agent = { workspace = true }
aie-faultline-evals = { workspace = true }
aie-faultline-cli = { workspace = true }
aie-faultline-api = { workspace = true }

[tool.pytest.ini_options]
# Bare `pytest` runs component unit tests (and repository-script tests) only.
# Run the other suites by path: pytest apps/api/tests | tests/integration | tests/e2e
testpaths = ["packages", "apps/cli", "scripts"]
pythonpath = ["scripts"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "api: API tests",
    "integration: tests that need external services",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "apps/*/src", "scripts"]
extend-exclude = [".internal"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["faultline_*", "repo_checks", "new_component"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "packages/core/src:packages/llm/src:packages/datasets/src:packages/replay/src:packages/ingest/src:packages/detect/src:packages/correlate/src:packages/knowledge/src:packages/tools/src:packages/agent/src:packages/evals/src:apps/cli/src:apps/api/src:scripts"
exclude = ["^\\.venv/", "^\\.internal/", "^\\.build/"]

[tool.bandit]
exclude_dirs = [".venv", ".internal", ".build"]
# assert is the pytest idiom; bandit runs on source trees, and tests are excluded by path.
skips = []
