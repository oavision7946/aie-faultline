[project]
name = "aie-faultline-api"
version = "0.0.0"
description = "HTTP API service."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["aie-faultline-core", "aie-faultline-agent"]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "faultline_api"

[tool.uv.sources]
aie-faultline-core = { workspace = true }
aie-faultline-agent = { workspace = true }
